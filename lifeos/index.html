<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS</title>
<link rel="icon" type="image/png" href="icons8-favicon-50.apng">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root">
  <div class="topbar">
    <div>
      <p class="greet-label" id="dateLabel">—</p>
      <h1 class="greet-name" id="greetName">Loading…</h1>
    </div>
    <button class="back-btn" id="backBtn" style="display:none;" onclick="goToScreen('dashboard')">← Back</button>
  </div>
  <div class="arc-wrap" id="arcWrap"></div>
  <main id="main"></main>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>
  <div class="toast" id="toast"></div>
  <nav>
    <button class="navbtn active" data-screen="dashboard"><span class="navicon">◆</span>Dashboard</button>
    <button class="navbtn" data-screen="activities"><span class="navicon">◷</span>Activities</button>
    <button class="navbtn" data-screen="growth"><span class="navicon">📚</span>Dashboard</button>
    <button class="navbtn" data-screen="finance"><span class="navicon">💵</span>Finance</button>
    <button class="navbtn" data-screen="me"><span class="navicon">☺</span>Me</button>
  </nav>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/activities.js"></script>
<script src="js/deen.js"></script>
<script src="js/growth.js"></script>
<script src="js/finance.js"></script>
<script src="js/me.js"></script>
<script src="js/app.js"></script>
</body>
</html>
