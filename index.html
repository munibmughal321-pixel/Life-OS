<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <div id="app">
    <div class="topbar" id="topbar" style="display:none;">
      <div>
        <p class="greet-label" id="date-label">—</p>
        <h1 class="greet-name" id="greet-name">Loading…</h1>
      </div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="display:none;">Logout</button>
    </div>

    <main id="screen-content"></main>

    <div class="toast" id="toast"></div>
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" id="modal-body"></div>
    </div>

    <nav id="bottom-nav" style="display:none;">
      <button class="navbtn active" data-screen="dashboard"><span class="navicon">◆</span>Dashboard</button>
      <button class="navbtn" data-screen="activities"><span class="navicon">◷</span>Activities</button>
      <button class="navbtn" data-screen="growth"><span class="navicon">📚</span>Growth</button>
      <button class="navbtn" data-screen="finance"><span class="navicon">₨</span>Finance</button>
      <button class="navbtn" data-screen="me"><span class="navicon">☺</span>Me</button>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
